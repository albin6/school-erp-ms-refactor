networks:
  school-erp-net:
    driver: bridge
volumes:
  identity_db_data:
  tenant_db_data:
  notification_db_data:
  audit_db_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log_data:
  grafana_data:
services:
  identity-db:
    image: postgres:16-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_pass
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [ school-erp-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U identity_user -d identity_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
  tenant-db:
    image: postgres:16-alpine
    container_name: tenant-db
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: tenant_pass
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    # ports:
    #   - "5433:5432"
    networks: [ school-erp-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tenant_user -d tenant_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks: [ school-erp-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notification_user -d notification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
  audit-db:
    image: postgres:16-alpine
    container_name: audit-db
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks: [ school-erp-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U audit_user -d audit_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass redis_pass --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [ school-erp-net ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_pass", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log_data:/var/lib/zookeeper/log
    networks: [ school-erp-net ]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    entrypoint:
      - /bin/bash
      - /usr/local/bin/kafka-bootstrap.sh
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLED_SHUTDOWN_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/kafka-bootstrap.sh:/usr/local/bin/kafka-bootstrap.sh:ro
    ports:
      - "29092:29092"
    networks: [ school-erp-net ]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [ kafka ]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    ports:
      - "8090:8080"
    networks: [ school-erp-net ]
  identity-service:
    build:
      context: .
      dockerfile: ./services/identity-service/Dockerfile
      target: production
    container_name: identity-service
    env_file: ./services/identity-service/.env
    ports:
      - "3001:3000"
      - "5001:5000"
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ school-erp-net ]
    restart: unless-stopped
  tenant-service:
    build:
      context: .
      dockerfile: ./services/tenant-service/Dockerfile
      target: production
    container_name: tenant-service
    env_file: ./services/tenant-service/.env
    ports:
      - "3002:3000"
      - "5002:5000"
    depends_on:
      tenant-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks: [ school-erp-net ]
    restart: unless-stopped
  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
      target: production
    container_name: notification-service
    env_file: ./services/notification-service/.env
    ports:
      - "3003:3000"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ school-erp-net ]
    restart: unless-stopped
  audit-service:
    build:
      context: .
      dockerfile: ./services/audit-service/Dockerfile
      target: production
    env_file: ./services/audit-service/.env
    expose:
      - "3000"
    depends_on:
      audit-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ school-erp-net ]
    restart: unless-stopped
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
      target: production
    container_name: api-gateway
    env_file: ./services/api-gateway/.env
    ports:
      - "8000:3000"
    depends_on:
      identity-service:
        condition: service_started
      tenant-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [ school-erp-net ]
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [ school-erp-net ]
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [ school-erp-net ]
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3100:3000"
    depends_on: [ prometheus, jaeger ]
    networks: [ school-erp-net ]
