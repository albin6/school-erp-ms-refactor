global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
  - job_name: 'identity-service'
    static_configs:
      - targets: ['identity-service:3000']
  - job_name: 'tenant-service'
    static_configs:
      - targets: ['tenant-service:3000']
  - job_name: 'academic-service'
    static_configs:
      - targets: ['academic-service:3000']
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3000']
  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:3000']
